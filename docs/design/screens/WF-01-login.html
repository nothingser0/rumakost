<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RumaKost · Masuk ke Akun</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    html, body {
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-canvas);
      padding: 24px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    /* Dedicated Center Wrapper locked to 100vh */
    .login-page-root {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      display: flex;
      width: 100%;
      max-width: 1040px;
      min-height: 600px;
      margin: auto;
      background: var(--bg-card);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-modal);
      overflow: hidden;
      border: 1px solid var(--border-card);
    }

    /* ==========================================================================
       LEFT SIDE: PURE ARCHITECTURAL VISUAL (Clean, Zero Text Clutter)
       ========================================================================== */
    .media-side-panel {
      flex: 1.12;
      position: relative;
      overflow: hidden;
      background: #F1F5F9;
    }

    .media-element {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* ==========================================================================
       RIGHT SIDE: PROFESSIONAL FORM HIERARCHY
       ========================================================================== */
    .form-panel {
      flex: 1;
      padding: 48px 46px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--bg-card);
    }

    /* UNIFIED BRAND & HEADER SECTION (No Competing Headings) */
    .brand-hero-section {
      margin-bottom: 24px;
    }

    .brand-emblem-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand-icon-box {
      width: 48px;
      height: 48px;
      filter: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform var(--transition-fast);
    }

    .brand-icon-box:hover {
      transform: translateY(-2px) scale(1.04);
    }

    .brand-text-group {
      display: flex;
      flex-direction: column;
    }

    .brand-name-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .brand-name-title span {
      color: var(--brand-primary);
    }

    .brand-tagline-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2px;
      margin-top: 2px;
    }

    /* FORM HEADLINE (Single H1 Intent) */
    .form-intent-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .form-intent-sub {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* 3-ROLE SEGMENTED CONTROL */
    .role-section {
      margin-bottom: 20px;
    }

    .role-section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: block;
    }

        .nav-pill-container.role-selector-bar {
      display: flex;
      width: 100%;
      background: #F4F5F7;
      padding: 5px;
      border-radius: var(--radius-full);
      border: 1px solid #ECEEF2;
      gap: 4px;
    }

    .nav-pill-container.role-selector-bar .nav-pill {
      flex: 1;
      justify-content: center;
      text-align: center;
      padding: 8px 12px;
    }

    /* FORM CONTROLS & LABELS */
    .form-group-item {
      margin-bottom: 16px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      display: block;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field-main {
      width: 100%;
      height: 46px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-subtle);
      background: #FAFAFA;
      padding: 10px 42px 10px 42px;
      font-size: 13.5px;
      color: var(--text-main);
      font-family: inherit;
      transition: all var(--transition-fast);
    }

    .input-field-main:focus {
      outline: none;
      border-color: var(--brand-primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.12);
    }

    .input-icon-left {
      position: absolute;
      left: 14px;
      color: var(--text-subtle);
      pointer-events: none;
    }

    .input-eye-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      padding: 0;
      transition: color var(--transition-fast);
    }

    .input-eye-btn:hover {
      color: var(--text-main);
    }

    /* ACTION ROW & REMEMBER ME */
    .form-actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      margin: 16px 0 22px;
      color: var(--text-secondary);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      color: var(--brand-primary);
      font-weight: 600;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* PRIMARY CTA BUTTON (Authoritative 48px Height) */
    .btn-submit-main {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--dark-pill);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 14px rgba(17, 17, 17, 0.22);
    }

    .btn-submit-main:hover {
      background: var(--dark-pill-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(17, 17, 17, 0.3);
    }

    .btn-submit-main:hover i {
      transform: translateX(3px);
    }

    .btn-submit-main i {
      transition: transform var(--transition-fast);
    }
  </style>
</head>
<body>
  <!-- CENTER WRAPPER (100vh Locked) -->
  <main class="login-page-root">
    <div class="login-container">
      
      <!-- LEFT SIDE: ARSITEKTUR HUNIAN (Murni Visual, Tanpa Teks) -->
      <div class="media-side-panel">
        <img 
          id="bgImage" 
          class="media-element" 
          src="assets/img/login-showcase.png" 
          alt="Arsitektur Hunian Kost Modern RumaKost"
        >
      </div>

      <!-- RIGHT SIDE: SINGLE SOURCE OF TRUTH (Refined Form Hierarchy) -->
      <div class="form-panel">
        
        <!-- 1. UNIFIED BRAND HERO SECTION -->
        <div class="brand-hero-section">
          <div class="brand-emblem-badge">
            <div class="brand-icon-box">
              <svg width="48" height="48" viewBox="0 0 52 52" fill="none">
                <rect width="52" height="52" rx="14" fill="#FF7A00"/>
                <polygon points="14,32 14,16 20,10 26,5 32,10 38,16 38,32" fill="#FFFFFF"/>
                <circle cx="26" cy="21" r="6.5" fill="#FF7A00"/>
                <rect x="23" y="31" width="6" height="16" fill="#FFFFFF" rx="1.5"/>
                <rect x="29" y="37" width="5" height="4" fill="#FFFFFF" rx="1"/>
                <rect x="29" y="44" width="3" height="3" fill="#FFFFFF" rx="1"/>
              </svg>
            </div>
            <div class="brand-text-group">
              <span class="brand-name-title">Ruma<span>Kost</span></span>
              <span class="brand-tagline-sub">Sistem Manajemen Kost Mandiri</span>
            </div>
          </div>

          <h1 class="form-intent-title">Masuk ke Akun</h1>
          <p class="form-intent-sub">Pilih peran Anda dan masukkan kredensial terdaftar.</p>
        </div>

        <!-- 2. ROLE SEGMENTED CONTROL -->
        <div class="role-section">
          <label class="role-section-label">Pilih Peran</label>
          <div class="nav-pill-container role-selector-bar">
            <button type="button" class="nav-pill active" id="btnRoleOwner" onclick="selectRole('owner')">Pemilik</button>
            <button type="button" class="nav-pill" id="btnRoleStaff" onclick="selectRole('staff')">Staf Pengelola</button>
            <button type="button" class="nav-pill" id="btnRoleTenant" onclick="selectRole('tenant')">Penghuni</button>
          </div>
        </div>

        <!-- 3. CREDENTIALS INPUT FORM -->
        <form onsubmit="handleLoginSubmit(event)">
          <!-- EMAIL FIELD -->
          <div class="form-group-item">
            <label class="field-label" for="inputEmail">Alamat Email</label>
            <div class="input-wrapper">
              <i data-lucide="mail" class="input-icon-left" style="width: 16px; height: 16px;"></i>
              <input type="email" class="input-field-main" id="inputEmail" value="budi.santoso@rumakost.id" required>
            </div>
          </div>

          <!-- PASSWORD FIELD -->
          <div class="form-group-item">
            <label class="field-label" for="inputPassword">Kata Sandi</label>
            <div class="input-wrapper">
              <i data-lucide="lock" class="input-icon-left" style="width: 16px; height: 16px;"></i>
              <input type="password" class="input-field-main" id="inputPassword" value="password123" required>
              <button type="button" class="input-eye-btn" onclick="togglePasswordVisibility()" title="Lihat Sandi">
                <i data-lucide="eye" id="eyeIcon" style="width: 16px; height: 16px;"></i>
              </button>
            </div>
          </div>

          <!-- REMEMBER ME & FORGOT PASSWORD -->
          <div class="form-actions-row">
            <label class="checkbox-label">
              <input type="checkbox" checked style="accent-color: #FF7A00; width: 15px; height: 15px;">
              <span>Ingat saya di perangkat ini</span>
            </label>
            <a href="#" class="forgot-link" onclick="RumaUI.showToast('Tautan pemulihan kata sandi telah dikirim ke email Anda', 'info', 'Lupa Sandi')">
              Lupa kata sandi?
            </a>
          </div>

          <!-- 4. PRIMARY ACTION BUTTON -->
          <button type="submit" class="btn-submit-main">
            <span>Masuk ke Akun</span>
            <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
          </button>
        </form>


      </div>

    </div>
  </main>

  <script src="assets/js/components.js"></script>
  <script>
    let activeRole = 'owner';

    const ROLE_CONFIG = {
      owner: {
        email: 'budi.santoso@rumakost.id',
        dest: 'WF-02-dashboard.html',
        title: 'Peran Pemilik',
        toast: 'Kredensial akun Pemilik disiapkan untuk dasbor eksekutif.'
      },
      staff: {
        email: 'rini.operasional@rumakost.id',
        dest: 'WF-02-dashboard.html?role=staf',
        title: 'Peran Staf Pengelola',
        toast: 'Kredensial akun Staf disiapkan untuk operasional harian.'
      },
      tenant: {
        email: 'budi.penghuni@rumakost.id',
        dest: 'WF-10-portal-penghuni.html',
        title: 'Peran Penghuni',
        toast: 'Kredensial akun Penghuni disiapkan untuk portal mandiri.'
      }
    };

    function selectRole(role) {
      activeRole = role;
      document.querySelectorAll('.nav-pill-container.role-selector-bar .nav-pill').forEach(btn => btn.classList.remove('active'));
      if (role === 'owner') document.getElementById('btnRoleOwner').classList.add('active');
      if (role === 'staff') document.getElementById('btnRoleStaff').classList.add('active');
      if (role === 'tenant') document.getElementById('btnRoleTenant').classList.add('active');

      const config = ROLE_CONFIG[role];
      document.getElementById('inputEmail').value = config.email;
      RumaUI.showToast(config.toast, 'info', config.title);
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('inputPassword');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const config = ROLE_CONFIG[activeRole];
      RumaUI.showToast('Kredensial valid. Mengarahkan Anda ke sistem...', 'success', 'Masuk Berhasil');
      setTimeout(() => {
        window.location.href = config.dest;
      }, 700);
    }
  </script>
</body>
</html>
